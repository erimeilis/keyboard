[package]
name = "hebrew-keyboard"
version = "0.1.0"
description = "Cross-platform Hebrew keyboard visualization app"
authors = ["Hebrew Keyboard Team"]
license = "MIT"
repository = "https://github.com/erimeilis/keyboard"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
